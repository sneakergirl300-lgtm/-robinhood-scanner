name: Part 2 verification

on:
  pull_request:
    paths:
      - 'analyzer.py'
      - 'v4_events.py'
      - 'tests/**'
      - 'risk_evidence.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Deterministic regression and failure tests
        run: python -m unittest discover -s tests -v
      - name: Offline two-run workflow integration
        run: python tests/workflow_smoke.py
      - name: Read-only bounded public RPC probe
        run: python tests/live_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: part2-verification-${{ github.run_id }}
          path: |
            verification.json
            live_probe.json
