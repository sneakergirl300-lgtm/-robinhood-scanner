name: Robinhood Contract Collector

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: robinhood-contract-collector
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Run collector
        run: python collector.py
      - name: Save discovery results
        if: always()
        run: |
          git config user.name "Robinhood Scanner"
          git config user.email "scanner@users.noreply.github.com"
          git add candidates.json state.json
          git diff --cached --quiet || git commit -m "Update Robinhood candidates"
          git pull --rebase origin main
          git push origin HEAD:main
