name: Robinhood Contract Collector

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run collector
        run: python collector.py

      - name: Save results
        run: |
          git config user.name "Robinhood Scanner"
          git config user.email "scanner@users.noreply.github.com"
          git add candidates.json state.json
          git diff --cached --quiet || git commit -m "Update Robinhood candidates"
          git push
